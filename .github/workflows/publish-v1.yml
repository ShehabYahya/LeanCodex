name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag matches plugin version
        shell: bash
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("plugins/dsh-cli-session/.codex-plugin/plugin.json"))["version"])')"
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match plugin version v${VERSION}" >&2
            exit 1
          }
          test -f "docs/releases/${GITHUB_REF_NAME}.md" || {
            echo "Missing release notes: docs/releases/${GITHUB_REF_NAME}.md" >&2
            exit 1
          }
      - name: Install test dependency
        run: python -m pip install -r requirements-test.txt
      - name: Compile Python sources
        run: python -m compileall -q plugins/dsh-cli-session scripts tests
      - name: Check launcher syntax
        run: node --check plugins/dsh-cli-session/scripts/launch_mcp.js
      - name: Run deterministic supervision tests
        run: python -m unittest -v tests/test_supervision.py
      - name: Verify MCP stdio contract
        run: python tests/test_mcp_stdio.py
      - name: Verify clean install bootstrap
        run: python tests/test_install_smoke.py

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}"             --target "${GITHUB_SHA}"             --title "${GITHUB_REF_NAME} — LeanCodex"             --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
