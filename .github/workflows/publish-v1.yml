name: Publish v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - docs/releases/v1.0.0.md

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "v1.0.0 already exists"
            exit 0
          fi
          gh release create v1.0.0 \
            --target "$GITHUB_SHA" \
            --title "v1.0.0 — Durable, resumable DSH session access" \
            --notes-file docs/releases/v1.0.0.md
