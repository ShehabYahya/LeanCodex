name: test

on:
  pull_request:
  push:
    branches:
      - feature/output-only-supervision
      - main

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MCP contract-test dependency
        run: python -m pip install -r requirements-test.txt
      - name: Compile supervision modules
        run: |
          python -m py_compile             plugins/dsh-cli-session/scripts/dsh_mcp_server.py             plugins/dsh-cli-session/skills/dsh-cli-session/scripts/dsh_*.py             scripts/build_review_bundle.py             tests/test_mcp_stdio.py             tests/test_supervision.py
      - name: Run deterministic supervision tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v tests/test_supervision.py 2>&1 | tee test-results.txt
      - name: Verify MCP stdio contract
        shell: bash
        run: |
          set -o pipefail
          python tests/test_mcp_stdio.py 2>&1 | tee -a test-results.txt
      - name: Build sanitized review bundle
        run: python scripts/build_review_bundle.py --test-results test-results.txt
      - name: Upload review bundle
        uses: actions/upload-artifact@v4
        with:
          name: dsh-supervision-review
          path: dsh-supervision-review.zip
          if-no-files-found: error
