name: test

on:
  pull_request:
  push:
    branches:
      - feature/output-only-supervision
      - main

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install -r requirements-test.txt
      - name: Compile Python sources
        run: python -m compileall -q plugins/dsh-cli-session scripts tests
      - name: Check launcher syntax
        run: node --check plugins/dsh-cli-session/scripts/launch_mcp.js
      - name: Run deterministic supervision tests
        run: python -m unittest -v tests/test_supervision.py
      - name: Verify MCP stdio contract
        run: python tests/test_mcp_stdio.py
      - name: Verify clean install bootstrap
        run: python tests/test_install_smoke.py
      - name: Build sanitized review bundle
        if: runner.os == 'Linux'
        run: python scripts/build_review_bundle.py
      - name: Upload review bundle
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-supervision-review
          path: dsh-supervision-review.zip
          if-no-files-found: error
