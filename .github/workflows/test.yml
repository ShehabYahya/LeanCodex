name: test

on:
  pull_request:
  push:
    branches:
      - feature/output-only-supervision
      - main

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile supervision modules
        run: |
          python -m py_compile             plugins/dsh-cli-session/scripts/dsh_mcp_server.py             plugins/dsh-cli-session/skills/dsh-cli-session/scripts/dsh_*.py
      - name: Run deterministic supervision tests
        run: python -m unittest -v tests/test_supervision.py
